tag: storycloze
task: storycloze_lecslab
dataset_path: lecslab/story_cloze
output_type: multiple_choice
process_docs: !function utils.process_docs_storycloze
process_results: !function utils.process_results_multiple_choice
training_split: train
validation_split: eval  # For few-shot examples (if num_fewshot > 0)
test_split: test   
doc_to_text: "{{query}}"
doc_to_target: "{{label}}"
doc_to_choice: "{{choices}}"
should_decontaminate: true
doc_to_decontamination_query: "{{query}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
  - metric: brier_score
    aggregation: brier_score
    higher_is_better: false
  - metric: ppl_correct_answer_norm
    aggregation: mean
    higher_is_better: false
  - metric: ppl_all_choices_norm
    aggregation: !function utils.micro_average_perplexity
    higher_is_better: false
  - metric: ece
    aggregation: !function utils.expected_calibration_error
    higher_is_better: false